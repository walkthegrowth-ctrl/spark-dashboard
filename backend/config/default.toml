# Spark Dashboard — Default Configuration

[server]
host = "127.0.0.1"
port = 8090

[collector]
ipc_socket = "/tmp/spark-collect.sock"

[database]
path = "~/.local/share/spark-dashboard/spark.db"
wal_mode = true

[history]
retention_days = 7

[thermal]
collection_interval_secs = 5

[memory]
collection_interval_secs = 5

[compute]
collection_interval_secs = 5

[power]
collection_interval_secs = 5
