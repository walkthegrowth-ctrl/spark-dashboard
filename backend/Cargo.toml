[package]
name = "spark-dashboard"
version = "0.1.0"
edition = "2021"
description = "Lightweight monitoring dashboard for NVIDIA DGX Spark (GB10)"
license = "MIT"

[[bin]]
name = "spark-collect"
path = "src/bin/collect.rs"

[[bin]]
name = "spark-serve"
path = "src/bin/serve.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tiny_http = "0.12"
libc = "0.2"

[dev-dependencies]
